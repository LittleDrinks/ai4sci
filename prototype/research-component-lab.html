    h1, h2, p { margin: 0; }

    .brand { font-size: 15px; font-weight: 850; }
    .question { min-width: 0; padding-left: 14px; border-left: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .question b { display: block; overflow: hidden; color: var(--ink); font-size: 15px; text-overflow: ellipsis; white-space: nowrap; }

    .event-column { display: grid; grid-template-rows: auto auto minmax(0, 1fr); border-right: 1px solid var(--line); }
    .playback { padding: 16px; border-bottom: 1px solid var(--line); }
    .playback-head { display: flex; align-items: center; justify-content: space-between; }
    .playback-head b { font-size: 15px; }
    .playback-head span { color: var(--green); font: 800 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .playback-controls { display: grid; grid-template-columns: 38px 38px minmax(0, 1fr) 38px; gap: 6px; margin-top: 13px; }

    .thread-band span { position: absolute; top: 17px; left: 18px; display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 10px; font-weight: 800; }

    .legend span { width: 25px; height: 25px; display: grid; place-items: center; font-size: 15px; }
    .graph-tools { position: absolute; z-index: 3; top: 14px; right: 14px; display: flex; gap: 6px; }

    .node { cursor: pointer; }
    .node foreignObject { overflow: visible; pointer-events: all; }

    .node-card.mechanism { border-radius: 25px 5px 25px 5px; }

    .decision { margin-inline: -22px; padding: 15px 22px 17px; border-bottom: 1px solid var(--line); }
    .decision span { color: var(--muted); font-size: 10px; }
    .decision p { margin-top: 7px; font-size: 13px; font-weight: 750; line-height: 1.5; }

    .empty { color: var(--muted); font-size: 12px; }
  </style>
</head>

      {at:'08/02 16:27',thread:'identity',avatar:'🔎',agent:'Independent audit',run:'ad8743b',title:'冲突解释也被否决',decision:'关闭 projected-gradient 与 alignment-weight 后续。',focus:'A-01'},
      {at:'08/02 18:08',thread:'event',avatar:'🤖',agent:'Research agent',run:'d1eeb5b',title:'连续时间路线暴露结构缺陷',decision:'停止时间密度调参，转向不对同时事件强加顺序的解码器。',focus:'M-01'},
      {at:'08/02 18:32',thread:'event',avatar:'🔎',agent:'Independent audit',run:'37f8b93',title:'Note-set mechanics 全部门槛通过',decision:'冻结 32 queries 与 Hungarian 配置；下一步只做未开封 reserve 的规模判别。',focus:'E-05'}
    ]
    const threads = [
      {id:'foundation',icon:'📊',label:'基准与目标',color:'#65746c'},
      {id:'identity',icon:'🎛️',label:'乐器身份',color:'#65746c'},
      {id:'event',icon:'🎼',label:'音符事件',color:'#65746c'}
    ]
    const reviews = {
      'Q-01': {gate:'exact F1 ≥ .40；第二真实集 ≥ +.03',observed:'事件与身份两条路线均未完成真实集确认',verdict:'目标仍开放',reason:'mechanics 通过不能替代 held-out performance。',audit:'等待最终 confirmatory protocol'},
      'B-01': {gate:'exact macro F1 ≥ .40',observed:'pitch .318006；exact .117337',verdict:'差距确认',reason:'仅修复身份也受当前事件库存上限制约。',audit:'10,000 次 cluster bootstrap'},
      'B-02': {gate:'固定库存身份是否足以到达 .40',observed:'exact .307970；retention .968',verdict:'仍不足',reason:'身份近乎饱和后仍低于目标，事件恢复必须并行推进。',audit:'matched-note oracle replay'},
      'E-01': {gate:'同源检索增益 ≥ +.03',observed:'+.012700 [.005951, .020462]',verdict:'关闭',reason:'方向为正但幅度不足，不在已消费的 15 groups 上调参。',audit:'contract + cross-fit audit'},
      'E-02': {gate:'至少一个预注册因素区间排除 0',observed:'5 个因素全部区间跨 0',verdict:'关闭',reason:'真实域差存在，但没有可单独行动的因素。',audit:'determinism audit passed'},
      'D-01': {gate:'权利合规且类别覆盖可用于机制验证',observed:'843 fit / 227 validation；12/20 类通过',verdict:'注册通过',reason:'只允许弱标签机制验证，不能支持 AMT 泛化声明。',audit:'14,915 excerpts rights audit'},
      'E-03': {gate:'增益 ≥ +.03 且置信下界 > 0',observed:'+.027320 [-.018323, .073799]',verdict:'关闭',reason:'点估计接近门槛，但幅度与下界同时失败。',audit:'independent audit passed'},
      'A-01': {gate:'至少 4 类在 3 seeds 中稳定冲突',observed:'通过类数 0；global medians 仅 1 seed 达标',verdict:'解释被否决',reason:'不能用稳定梯度冲突解释 E-03 的结果。',audit:'128 fit-only batches · byte replay'},
      'E-04': {gate:'连续时间优于量化控制且减少顺序修复',observed:'47/47，但 MAE 更高且需 14–20 次修复',verdict:'关闭',reason:'时间网格不是瓶颈，缺陷来自同时事件的任意顺序。',audit:'two contracts + independent audit'},
      'M-01': {gate:'能解释 E-04 与量化控制差异',observed:'量化控制 4.553 ms；连续输出仍需顺序修复',verdict:'结构解释成立',reason:'下一实验必须移除自回归事件顺序，而不是增加时间密度。',audit:'frozen-result inference'},
      'E-05': {gate:'容量、基数、重复、顺序修复、音频依赖全部通过',observed:'3 seeds 47/47；0 repairs；97.71% capacity',verdict:'Mechanics 通过',reason:'允许进入新 reserve 的规模判别，不构成泛化结论。',audit:'independent audit b2bcf76… passed'},
      'N-01': {gate:'冻结配置后在 composition-disjoint reserve 上优于控制',observed:'37 groups 未开封；标签与预测未读取',verdict:'待执行',reason:'这是当前唯一获准的下一实验。',audit:'data firewall active'}
    }
    const stateMeta = {
      open:['开放','#5d6c64','#edf1ee','◌'], reproduced:['已复现','#7356a6','#eee8f8','✓'], closed:['已关闭','#af433a','#fae6e3','×'],
      registered:['已注册','#247894','#e3f1f5','✓'], supported:['已定位','#217553','#e2f0e7','◆'], passed:['已通过','#217553','#e2f0e7','✓'], queued:['待执行','#b86d12','#fff0d6','▶']
    }
    const agentOwners = {
      'Q-01':['🎯','Research lead','GOAL.md','📐','Benchmark agent','completion gates'],
      'B-01':['📐','Benchmark agent','study.yaml','🔁','Replay checker','10k bootstrap'],
      'B-02':['📐','Benchmark agent','exp20','🔁','Replay checker','matched-note oracle'],
      'E-01':['🤖','Research agent','483f62c','🔎','Contract audit','b0024c…'],
      'E-02':['🤖','Research agent','ef899a5','🔎','Determinism audit','466510…'],
      'D-01':['🗂️','Data audit agent','1c16d78','⚖️','Rights checker','14,915 excerpts'],
      'E-03':['🤖','Research agent','c93b928','🔎','Independent audit','1ecaef…'],
      'A-01':['🔎','Audit agent','ad8743b','🔁','Byte replay','b8c044…'],
      'E-04':['🤖','Research agent','d1eeb5b','🔎','Independent audit','f9b84a…'],
      'M-01':['🤖','Research agent','d1eeb5b','📐','Frozen-result check','E-04'],
      'E-05':['🤖','Research agent','37f8b93','🔎','Independent audit','b2bcf76…'],
      'N-01':['🧭','Planner agent','next contract','🔒','Data firewall','37 groups sealed']
    }
    const colors = {question:'#5d6c64',observation:'#7356a6',mechanism:'#217553',experiment:'#b86d12',result:'#247894',audit:'#af433a'}
    const fills = {question:'#edf1ee',observation:'#eee8f8',mechanism:'#e2f0e7',experiment:'#fff0d6',result:'#e3f1f5',audit:'#fae6e3'}
    const initialStep = Number(new URLSearchParams(location.search).get('stage') || 0)
    let step = Math.max(0, Math.min(initialStep, events.length - 1)), selectedId = eventAt(initialStep).focus, playing = false, timer, zoomLevel = 1, simulation
    const svg = d3.select('#graph')
    const root = svg.append('g')
    const edgeLayer = root.append('g')
    const nodeLayer = root.append('g')
    const zoom = d3.zoom().scaleExtent([.55, 1.8]).on('zoom', event => root.attr('transform', event.transform))
    svg.call(zoom)

    function visibleNodes() { return nodes.filter(node => node.at <= step) }
    function visibleEdges() { return edges.filter(edge => edge.at <= step) }
    function nodeById(id) { return nodes.find(node => node.id === id) }
    function threadById(id) { return threads.find(thread => thread.id === id) }
    function eventAt(index) { return events[Math.max(0, Math.min(index, events.length - 1))] }
    function edgeId(edge) { return `${edge.source.id || edge.source}-${edge.target.id || edge.target}` }
    function render() {
      syncUrl()
      renderHeader()
      renderThreads()
      renderThreadBands()
      renderEvents()
      renderGraph()
      selectNode(selectedId, false)
    }
    function syncUrl() {
      const url = new URL(location.href)
      url.searchParams.set('stage', step)
      history.replaceState(null, '', url)
    }
    function renderHeader() {
      const event = eventAt(step)
      document.getElementById('run-status').textContent = `${event.run} · ${playing ? 'running' : 'paused'}`
      document.getElementById('stage-label').textContent = `${step + 1} / ${events.length}`
      document.getElementById('world-time').textContent = event.at
      document.getElementById('world-event').textContent = event.title
      document.getElementById('progress').style.setProperty('--progress', `${(step + 1) / events.length * 100}%`)
      document.getElementById('play').textContent = playing ? 'Ⅱ' : '▶'
      renderStats()
    }
    function renderStats() {
      const shown = visibleNodes()
      const trials = shown.filter(node => node.type === 'experiment')
      const activeThreads = new Set(shown.map(node => node.thread)).size
      const stats = [[activeThreads,'线程'],[trials.filter(node=>node.state==='closed').length,'已关闭'],[trials.filter(node=>node.state==='queued').length,'待执行']]
      document.getElementById('stats').innerHTML = stats.map(stat => `<span class="stat"><b>${stat[0]}</b>${stat[1]}</span>`).join('')
    }
    function renderThreads() {
      const current = eventAt(step).thread
      document.getElementById('thread-overview').innerHTML = threads.map(thread => threadChip(thread, current)).join('')
    }
    function threadChip(thread, current) {
      const count = events.slice(0, step + 1).filter(event => event.thread === thread.id).length
      return `<div class="thread-chip ${thread.id===current?'current':''}" style="--thread:${thread.color}"><i>${thread.icon}</i><b>${thread.label}</b><span>${count} EVENTS</span></div>`
    }
    function renderThreadBands() {
      document.getElementById('thread-bands').innerHTML = threads.map(thread => `<div class="thread-band"><span>${thread.icon} ${thread.label}</span></div>`).join('')
    }
    function renderEvents() {
      const list = document.getElementById('event-list')
      list.replaceChildren(...events.slice(0, step + 1).map(makeEventRow))
      list.lastElementChild?.scrollIntoView({block:'nearest'})
    }
    function makeEventRow(event, index) {
      const row = document.createElement('button')
      const thread = threadById(event.thread)
      const lane = threads.findIndex(item => item.id === event.thread)
      row.className = `event-row ${index===step?'new':''} ${event.focus===selectedId?'selected':''}`
      row.style.setProperty('--thread', thread.color)
      row.innerHTML = `<time class="event-time">${event.at.slice(6)}</time>${threadRail(lane,thread)}<span class="event-copy"><b>${event.title}</b><span>${event.decision}</span><i class="stage-badge">${event.avatar} ${event.agent}</i></span>`
      row.onclick = () => selectNode(event.focus)
      return row
    }
    function threadRail(lane, thread) {
      const dots = threads.map((_, index) => `<i class="${index===lane?'active':''}"></i>`).join('')
      return `<span class="thread-rail" style="--lane:${lane};--thread:${thread.color}">${dots}</span>`
    }
    function renderGraph() {
      const width = document.getElementById('graph-wrap').clientWidth
      const height = document.getElementById('graph-wrap').clientHeight
      svg.attr('viewBox', `0 0 ${width} ${height}`)
      const graphNodes = visibleNodes().map(node => ({...node}))
      const graphEdges = visibleEdges().map(edge => ({...edge}))
      joinEdges(graphEdges)
      joinNodes(graphNodes)
      runLayout(graphNodes, graphEdges, width, height)
    }
    function joinEdges(graphEdges) {
      edgeLayer.selectAll('path').data(graphEdges, edgeId).join(
        enter => enter.append('path').attr('class', edge => `edge ${edge.kind} ${edge.at === step ? 'new' : ''}`),
        update => update.attr('class', edge => `edge ${edge.kind}`),
        exit => exit.remove()
      )
    }
    function joinNodes(graphNodes) {
      const groups = nodeLayer.selectAll('g').data(graphNodes, node => node.id).join(enterNode, updateNode, exit => exit.remove())
      groups.on('click', (_, node) => selectNode(node.id))
      groups.call(d3.drag().on('start', dragStarted).on('drag', dragged).on('end', dragEnded))
    }
    function enterNode(enter) {
      const group = enter.append('g').attr('class', nodeClass)
      group.append('foreignObject').attr('x',-88).attr('y',-46).attr('width',176).attr('height',92).html(nodeHtml)
      return group
    }
    function nodeHtml(node) {
      const state = stateMeta[node.state] || [node.state,colors[node.type],fills[node.type],'·']
      return `<div xmlns="http://www.w3.org/1999/xhtml" class="node-card ${node.type} ${node.state}" style="--node-color:${state[1]};--node-fill:${state[2]}"><span class="node-top"><i class="node-icon">${node.icon}</i><span class="node-code">${node.id}</span><span class="node-state">${state[0]}</span></span><b>${node.title}</b><small>${node.summary}</small></div>`
    }
    function updateNode(update) { return update.attr('class', nodeClass) }
    function nodeClass(node) {
      const affected = step === 5 && node.id === 'E-03'
      return `node ${node.at===step?'new':''} ${node.id===selectedId?'selected':''} ${affected?'affected':''} ${node.state}`
    }
    function runLayout(graphNodes, graphEdges, width, height) {
      simulation?.stop()
      simulation = d3.forceSimulation(graphNodes).force('link', d3.forceLink(graphEdges).id(node=>node.id).distance(165).strength(.64)).force('charge', d3.forceManyBody().strength(-780)).force('x',d3.forceX(node=>threadX(node.thread,width)).strength(.18)).force('y',d3.forceY(height/2+24).strength(.05)).force('collide',d3.forceCollide(104))
      simulation.on('tick', () => positionGraph(width, height))
      simulation.on('end', () => positionGraph(width, height))
      simulation.stop()
      settleSimulation(graphNodes, width, height)
      positionGraph(width, height)
      simulation.alpha(.08).restart()
    }
    function settleSimulation(graphNodes, width, height) {
      for (let index = 0; index < 240; index += 1) {
        simulation.tick()
        graphNodes.forEach(node => clampNode(node, width, height))
      }
    }
    function clampNode(node, width, height) {
      node.x = clamp(node.x, 98, width - 98)
      node.y = clamp(node.y, 92, height - 58)
    }
    function threadX(threadId, width) {
      const lane = Math.max(0, threads.findIndex(thread => thread.id === threadId))
      return width * ((lane + .5) / threads.length)
    }
    function positionGraph(width, height) {
      nodeLayer.selectAll('g').attr('transform', node => { clampNode(node,width,height); return `translate(${node.x},${node.y})` })
      edgeLayer.selectAll('path').attr('d', edge => edgePath(edge, width, height))
    }
    function edgePath(edge, width, height) {
      const sx=clamp(edge.source.x,98,width-98), sy=clamp(edge.source.y,92,height-58)
      const tx=clamp(edge.target.x,98,width-98), ty=clamp(edge.target.y,92,height-58)
      const bend=(tx-sx)*.18
      return `M${sx},${sy} C${sx+bend},${sy} ${tx-bend},${ty} ${tx},${ty}`
    }
    function clamp(value, min, max) { return Math.max(min, Math.min(max, value || min)) }
    function dragStarted(event, node) { if (!event.active) simulation.alphaTarget(.25).restart(); node.fx = node.x; node.fy = node.y }
    function dragged(event, node) { node.fx = event.x; node.fy = event.y }
    function dragEnded(event, node) { if (!event.active) simulation.alphaTarget(0); node.fx = null; node.fy = null }
    function selectNode(id, rerender=true) {
      if (!nodeById(id) || nodeById(id).at > step) id = eventAt(step).focus
      selectedId = id
      nodeLayer.selectAll('g').classed('selected', node => node.id === id)
      renderDetail(nodeById(id))
      if (rerender) renderEvents()
    }
    function renderDetail(node) {
      const review = reviews[node.id]
      const state = stateMeta[node.state] || [node.state,colors[node.type],fills[node.type],'·']
      const rows = detailRows(node,review).map(ledgerRow).join('')
      document.getElementById('detail').innerHTML = detailHtml(node,review,state,rows)
      renderImpact(node)
    }
    function detailHtml(node,review,state,rows) {
      return `<div class="detail-head"><span class="detail-code">${node.icon} ${node.id} · ${threadById(node.thread).label}</span><span class="detail-state" style="--state-color:${state[1]};--state-fill:${state[2]}">${state[0]}</span></div><h2>${node.title}</h2><p>${node.summary}</p>${agentHtml(node.id)}<section class="review-verdict" style="--state-color:${state[1]};--state-fill:${state[2]}"><i>${state[3]}</i><div><b>${review.verdict}</b><p>${review.reason}</p></div></section><section class="comparison"><div><span>预注册门槛</span><b>${review.gate}</b></div><div><span>实际观测</span><b>${review.observed}</b></div></section><section class="decision"><span>本次裁决</span><p>${decisionFor(node.id)}</p></section><div class="ledger">${rows}</div>`
    }
    function agentHtml(id) {
      const agent = agentOwners[id]
      return `<section class="agent-strip">${agentCell(agent.slice(0,3),'执行 Agent')}${agentCell(agent.slice(3),'审查 Agent')}</section>`
    }
    function agentCell([icon,name,run],label) {
      return `<div class="agent-cell"><i>${icon}</i><span>${label}<b>${name}</b><small>${run}</small></span></div>`
    }
    function detailRows(node,review) {
      return [['证据来源',node.source],['运行范围',node.owner],['审计',review.audit],node.unknown?['仍未知',node.unknown]:null].filter(Boolean)
    }
    function ledgerRow([key,value]) { return `<div class="ledger-row"><span>${key}</span><b>${value}</b></div>` }
    function decisionFor(id) {
      return events.find(event => event.focus === id)?.decision || reviews[id].reason
    }
    function renderImpact(node) {
      const outgoing = visibleEdges().filter(edge => (edge.source.id || edge.source) === node.id)
      const items = outgoing.map(edge => impactRow(edge)).join('')
      document.getElementById('impact').innerHTML = `<h2>直接影响 · ${outgoing.length}</h2><div class="impact-list">${items || '<span class="empty">尚无下游节点</span>'}</div>`
    }
    function impactRow(edge) {
      const target = nodeById(edge.target.id || edge.target)
      return `<div class="impact-row"><i></i><div><b>${target.id} · ${target.title}</b><small>${edge.kind}</small></div></div>`
    }
    function goTo(index) {
      stopPlayback()
      step = Math.max(0, Math.min(index, events.length - 1))
      selectedId = eventAt(step).focus
      render()
    }
    function nextStep() {
      if (step >= events.length - 1) return stopPlayback()
      step += 1
      selectedId = eventAt(step).focus
      render()
    }
    function togglePlayback() {
      if (playing) return stopPlayback()
      if (step === events.length - 1) step = 0
      playing = true
      render()
      timer = setInterval(nextStep, 1800)
    }
    function stopPlayback() {
      playing = false
      clearInterval(timer)
      renderHeader()
    }
    function applyZoom(level) {
      zoomLevel = Math.max(.55, Math.min(1.8, level))
      svg.transition().duration(220).call(zoom.transform, d3.zoomIdentity.translate((1-zoomLevel)*svg.node().clientWidth/2,(1-zoomLevel)*svg.node().clientHeight/2).scale(zoomLevel))
    }
    document.getElementById('play').onclick = togglePlayback
    document.getElementById('next').onclick = nextStep
    document.getElementById('reset').onclick = () => goTo(0)
    document.getElementById('zoom-in').onclick = () => applyZoom(zoomLevel + .2)
    document.getElementById('zoom-out').onclick = () => applyZoom(zoomLevel - .2)
    document.getElementById('zoom-reset').onclick = () => applyZoom(1)
    window.addEventListener('resize', renderGraph)
    render()
  </script>
</body>
</html>
