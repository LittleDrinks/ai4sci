[project]
name = "research-world"
version = "0.1.0"
description = "A data-centered control plane for scientific research agents"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "python-dotenv==1.1.1",
  "researchharness==0.0.52",
  "uvicorn[standard]==0.35.0",
]

[project.scripts]
research-world = "server.cli:main"
research-worker = "worker.__main__:main"

[dependency-groups]
dev = [
  "pytest==8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server", "worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
